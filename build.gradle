plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.epam'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// 1. Spring Boot Web starter for building REST APIs
	implementation 'org.springframework.boot:spring-boot-starter-web'

	// 2. Spring Boot Security starter (for Principal, SecurityContext, future auth integration)
	implementation 'org.springframework.boot:spring-boot-starter-security'

	// 3. Jackson for JSON processing
	// - jackson-databind for JSON serialization/deserialization
	// - jackson-datatype-jsr310 for Java 8+ date/time support (LocalDate, OffsetDateTime)
	implementation 'com.fasterxml.jackson.core:jackson-databind'
	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

	// 4. SpringDoc OpenAPI UI for Swagger documentation
	// Accessible at: http://localhost:8080/swagger-ui/index.html
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'

	// 5. Lombok to reduce boilerplate code (Getters, Setters, Constructors, etc.)
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// 6. Hibernate Validator for Bean Validation (JSR-380)
	implementation 'org.hibernate.validator:hibernate-validator'

	// 8. Spring Boot Starter Test (Includes JUnit 5, Mockito, Spring Test, AssertJ)
	testImplementation 'org.springframework.boot:spring-boot-starter-test'

	// 9. Spring Security Test for testing secured endpoints
	testImplementation 'org.springframework.security:spring-security-test'
}

tasks.named('test') {
	useJUnitPlatform()
}
